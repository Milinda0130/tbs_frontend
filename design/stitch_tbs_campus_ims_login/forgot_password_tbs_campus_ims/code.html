<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 antialiased">

</div>
</div>

<div class="bg-surface-container-lowest rounded-xl border border-outline-variant p-lg shadow-[0px_2px_4px_rgba(0,0,0,0.05)]">
<div class="flex flex-col gap-sm mb-md text-center">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Forgot your password?</h2>
<p class="font-body-md text-body-md text-on-surface-variant px-4">
                    Enter your email and we will send you a reset link.
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-[10px] bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="name@tbs-campus.edu" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md py-3 rounded-DEFAULT transition-colors flex items-center justify-center gap-2 mt-xs" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_right_alt">arrow_right_alt</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="text-center mt-sm">
<a class="inline-flex items-center gap-xs font-body-md text-body-md text-primary hover:text-on-primary-fixed-variant transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
